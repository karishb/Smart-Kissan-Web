<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartKisan Web Platform - Precision Agrarian GIS & Smart Irrigation</title>
  
  <!-- Progressive Web App (PWA) Manifest & Meta -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2E7D32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SmartKisan" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

  <!-- Leaflet GIS Map Styles -->
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
    crossorigin="" 
  />

  <!-- SmartKisan Design System -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <a href="#/dashboard" class="nav-brand">
      <div class="brand-icon">🌱</div>
      <div style="display: flex; align-items: center;">
        <span class="brand-name">SmartKisan</span>
        <span class="brand-tag">WEB PORTAL</span>
      </div>
    </a>

    <ul class="nav-menu" id="nav-links">
      <!-- Populated dynamically by App.updateNavbar -->
    </ul>

    <div class="nav-user" id="nav-user">
      <!-- Populated dynamically by App.updateNavbar -->
    </div>
  </header>

  <!-- Dynamic SPA View Outlet -->
  <main id="app">
    <!-- Rendered by Router -->
  </main>

  <!-- Global Toast Notifications Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Leaflet GIS Mapping Engine -->
  <script 
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
    crossorigin=""
  ></script>

  <!-- SmartKisan Web Modules -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/views/loginView.js"></script>
  <script src="js/views/registerView.js"></script>
  <script src="js/views/dashboardView.js"></script>
  <script src="js/views/pumpsView.js"></script>
  <script src="js/views/fieldsView.js"></script>
  <script src="js/views/schedulesView.js"></script>
  <script src="js/views/sensorsView.js"></script>
  <script src="js/views/aiAdvisoryView.js"></script>
  <script src="js/views/reportsView.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => {
            console.log('SmartKisan PWA Service Worker registered:', reg.scope);
          })
          .catch((err) => {
            console.warn('SmartKisan PWA Service Worker registration non-fatal error:', err);
          });
      });
    }
  </script>
</body>
</html>

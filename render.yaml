# Render Blueprint for SmartKisan Web Platform
# Free, ultra-fast static site hosting with global CDN & SPA rewrite rules
services:
  - type: web
    name: smartkisan-web
    runtime: static
    plan: free
    region: singapore
    buildCommand: ""
    staticPublishPath: ./
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production

